services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-financebot}
      POSTGRES_USER: ${DB_USER:-financebot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-financebot}
    volumes:
      - pgdata:/var/lib/postgresql
      # Cria o banco de testes (financebot_test) em volumes novos, mantendo o
      # `./mvnw test` isolado do banco de desenvolvimento.
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: ${DB_NAME:-financebot}
      DB_USER: ${DB_USER:-financebot}
      DB_PASSWORD: ${DB_PASSWORD:-financebot}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Sao_Paulo}
      TZ: ${APP_TIMEZONE:-America/Sao_Paulo}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      AI_BASE_URL: ${AI_BASE_URL:-https://api.openai.com/v1}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TRANSCRIPTION_MODEL: ${AI_TRANSCRIPTION_MODEL:-whisper-1}
      AI_EXTRACTION_MODEL: ${AI_EXTRACTION_MODEL:-gpt-4o-mini}
      AI_TRANSCRIPTION_LANGUAGE: ${AI_TRANSCRIPTION_LANGUAGE:-}
    ports:
      - "8080:8080"

volumes:
  pgdata:
